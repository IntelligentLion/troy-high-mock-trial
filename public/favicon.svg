<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0D1B2A"/>
  <!-- Balance scale beam -->
  <line x1="16" y1="8" x2="16" y2="24" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="11" x2="24" y2="11" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left pan suspension -->
  <line x1="9" y1="11" x2="9" y2="16" stroke="#C9A84C" stroke-width="1" stroke-linecap="round"/>
  <line x1="23" y1="11" x2="23" y2="16" stroke="#C9A84C" stroke-width="1" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M6 16 Q9 19 12 16" stroke="#C9A84C" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Right pan -->
  <path d="M20 16 Q23 19 26 16" stroke="#C9A84C" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Base -->
  <line x1="13" y1="24" x2="19" y2="24" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top circle -->
  <circle cx="16" cy="8" r="1.2" fill="#C9A84C"/>
</svg>
